name: Проверка проекта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить исходный код
        run: python -m compileall -q src scripts tests
      - name: Запустить модульные тесты
        run: python -m unittest discover -s tests -v
